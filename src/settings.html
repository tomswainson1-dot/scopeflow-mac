<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ececec;
    --card: #ffffff;
    --line: rgba(0, 0, 0, .1);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --button: #2191fb;
    --button-text: #ffffff;
    --track: rgba(0, 0, 0, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --card: #2b2b2d;
      --line: rgba(255, 255, 255, .1);
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --track: rgba(255, 255, 255, .14);
    }
  }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  main { padding: 18px 22px 20px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card + .card { margin-top: 12px; }
  .status { display: flex; gap: 14px; align-items: center; }
  .status img { width: 48px; height: 48px; flex: none; }
  .words { flex: 1; min-width: 0; }
  #title { font-weight: 600; font-size: 14px; }
  #detail { color: var(--text); margin-top: 1px; }
  #checked { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--button); transition: width .2s ease; }
  button {
    flex: none;
    font: inherit;
    font-weight: 500;
    color: var(--button-text);
    background: var(--button);
    border: 0;
    border-radius: 6px;
    padding: 5px 14px;
    min-width: 120px;
  }
  button:active { filter: brightness(.9); }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .row input[type="checkbox"] { margin: 0; }
  .sub { padding-left: 22px; }
  select { font: inherit; margin-left: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin: 12px 2px 0; }
</style>
</head>
<body>
<main>
  <h1>Updates</h1>
  <section class="card status" aria-live="polite">
    <img src="../assets/icon.png" alt="">
    <div class="words">
      <div id="title">ScopeFlow</div>
      <div id="detail"></div>
      <div class="bar" id="bar" hidden><div id="fill"></div></div>
      <div id="checked"></div>
    </div>
    <button id="action" type="button">Check Now</button>
  </section>
  <section class="card">
    <label class="row"><input type="checkbox" id="automatic"> Check for updates automatically</label>
    <div class="sub" id="auto">
      <label class="row"><input type="checkbox" id="checkOnLaunch"> When ScopeFlow opens</label>
      <label class="row">While ScopeFlow is open, check again <select id="intervalHours"></select></label>
    </div>
    <label class="row"><input type="checkbox" id="downloadInBackground"> Download updates in the background, then ask to restart</label>
  </section>
  <p class="hint">ScopeFlow always asks before it restarts. Updates come from ScopeFlow's releases on GitHub, and each download is checked against the SHA-256 checksum published with that release before it is installed.</p>
</main>
<script src="settings-renderer.js"></script>
</body>
</html>
